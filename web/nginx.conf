server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router / client-side routes (for OAuth redirects like /github)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; keep index.html controlled by the default rule.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
