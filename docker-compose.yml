services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codebase-intelligence-api
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DB_PATH: ${DB_PATH:-/app/data/code_review_results.db}
      VECTOR_DB_PATH: ${VECTOR_DB_PATH:-/app/data/chroma_db}
      CHROMA_HOST: ${CHROMA_HOST:-chroma}
      CHROMA_PORT: ${CHROMA_PORT:-8000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-fast}
      GPT_REVIEW_MODEL: ${GPT_REVIEW_MODEL:-gpt-4o-mini}
      GPT_TIMEOUT_SECONDS: ${GPT_TIMEOUT_SECONDS:-30}
      MAX_ANALYSIS_FILES: ${MAX_ANALYSIS_FILES:-40}
      ENABLE_RAG: ${ENABLE_RAG:-false}
    ports:
      - "8000:8000"
    volumes:
      - codebase-intelligence-api-data:/app/data
    depends_on:
      - chroma
    networks:
      - codebase-intelligence-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: codebase-intelligence-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - codebase-intelligence-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: codebase-intelligence-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      CHROMA_SERVER_HOST: ${CHROMA_SERVER_HOST:-0.0.0.0}
      CHROMA_SERVER_HTTP_PORT: ${CHROMA_SERVER_HTTP_PORT:-8000}
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - codebase-intelligence-chroma-data:/chroma/chroma
    networks:
      - codebase-intelligence-net
    restart: unless-stopped

networks:
  codebase-intelligence-net:
    name: codebase-intelligence-net
    driver: bridge

volumes:
  codebase-intelligence-api-data:
    name: codebase-intelligence-api-data
  codebase-intelligence-chroma-data:
    name: codebase-intelligence-chroma-data
