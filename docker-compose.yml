services:
  api:
    build: .
    container_name: codebase-intelligence-api
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DB_PATH: ${DB_PATH:-/app/data/code_review_results.db}
      VECTOR_DB_PATH: ${VECTOR_DB_PATH:-/app/data/chroma_db}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-fast}
      GPT_REVIEW_MODEL: ${GPT_REVIEW_MODEL:-gpt-4o-mini}
      GPT_TIMEOUT_SECONDS: ${GPT_TIMEOUT_SECONDS:-30}
      MAX_ANALYSIS_FILES: ${MAX_ANALYSIS_FILES:-40}
      ENABLE_RAG: ${ENABLE_RAG:-false}
    volumes:
      - codebase-intelligence-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    container_name: codebase-intelligence-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  codebase-intelligence-data:
